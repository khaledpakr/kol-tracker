name: Update feed

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Track caller wallets
        continue-on-error: true
        env:
          CT_STATE: data/slingoor_state.json
        run: python scripts/copytrade.py > data/last_events.json

      - name: Build feed
        run: python scripts/build_feed.py

      - name: Build realized PnL
        continue-on-error: true
        run: python scripts/build_pnl.py

      - name: Commit and push data changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json pnl.json data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update feed and tracker state"
            git push origin HEAD
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
